[tool.poetry]
name = "Chatchat"
version = "0.3.0"
description = "Langchain-Chatchat"
authors = ["chatchat"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/chatchat-space/Langchain-Chatchat.git"
packages = [
    { include = "chatchat", from = "libs/chatchat-server" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
uvicorn = "0.22.0"
fastapi = "^0.110.3"
starlette = "^0.37.2"  # 更新到与 fastapi 兼容的版本
nltk = "^3.9.1"
memoization = "^0.4.0"
pydantic-settings = "^2.8.1"
ruamel-yaml = "^0.18.10"
langchain = "^0.1.1"
langchain-openai = "^0.0.5"
sse-starlette = "1.6.5"
pydantic = "^2.7.4"
openai = "^1.72.0"
loguru = "^0.7.2"
python-multipart = "^0.0.9"
sqlalchemy = "^2.0.27"
colorama = "^0.4.6"
tiktoken = ">=0.5.2,<0.6.0"
numpy = "^1.26.4"
pandas = "^2.2.0"
scipy = "^1.12.0"
tqdm = "^4.66.2"
requests = "^2.31.0"
aiohttp = "^3.9.3"
tenacity = "^8.2.3"
typing-extensions = "^4.9.0"
python-dotenv = "^1.0.1"
torch = "2.1.0"
transformers = "^4.51.1"
chardet = "^5.2.0"
beautifulsoup4 = "^4.12.3"
markdown = "^3.5.2"
markdownify = "0.11.6"
docx2txt = "^0.8"
pypdf = "^4.0.1"
unstructured = "^0.12.3"
pillow = "^10.2.0"
pymupdf = "^1.23.25"
faiss-cpu = "^1.7.4"
chromadb = "^0.4.22"
sentence-transformers = "^2.3.1"
rapidfuzz = "3.6.1"
langchain-experimental = "^0.0.49"
streamlit = "^1.44.1"
streamlit-antd-components = "^0.3.2"
streamlit-chatbox = "^1.1.13.post1"
streamlit-extras = "^0.6.0"
streamlit-paste-button = "^0.1.2"
streamlit-aggrid = "^1.1.2"
xinference-client = "^1.4.1"  # 回退到稳定版本
xinference = "^1.4.1"  # 回退到稳定版本

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "default"

[tool.ruff]
extend-include = ["*.ipynb"]
extend-exclude = [
    "docs/docs/expression_language/why.ipynb"  # TODO: look into why linter errors
]

[tool.ruff.lint.per-file-ignores]
"**/{cookbook,docs}/*" = [
    "E402",  # allow imports to appear anywhere in docs
    "F401",  # allow "imported but unused" example code
    "F811",  # allow re-importing the same module, so that cells can stay independent
    "F841",  # allow assignments to variables that are never read -- it's example code
]

# These files were failing the listed rules at the time ruff was adopted for notebooks.
# Don't require them to change at once, though we should look into them eventually.
"cookbook/gymnasium_agent_simulation.ipynb" = ["F821"]
"docs/docs/integrations/document_loaders/tensorflow_datasets.ipynb" = ["F821"]

[tool.poetry.plugins.dotenv]
ignore = "false"
dotenv = "dotenv:plugin"

